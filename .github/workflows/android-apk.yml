# Android 用の APK を作る (ブランチへの push か、Actions 画面から手動で実行)
# 完成した APK は、実行結果の「Artifacts」から hidamari-island-apk をダウンロードできる
name: Android APK

on:
  push:
    branches: [ccr-dbbbc653-9twkf9]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: ゲームをビルド (単一HTML)
        run: |
          npm ci
          npm run build
          mkdir -p www
          cp dist/index.html www/index.html
      - name: Android プロジェクトに反映
        run: npx cap sync android
      - name: APK を作る
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: hidamari-island-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
