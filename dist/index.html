<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="ひだまり島 - 3Dのスローライフゲーム">
<title>ひだまり島</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --cream: #fff8ea; --paper: #fffdf6; --brown: #6b4a2b; --brown-d: #4a3019; --leaf: #5fae5a; --leaf-d: #3f8a3c;
  --sky: #9fd8ff; --shadow: 0 6px 18px rgba(60, 40, 20, .28);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --cream: #2d2620; --paper: #3a3028; --brown: #e7c9a0; --brown-d: #f5e2c6; } }
:root[data-theme="dark"] { --cream: #2d2620; --paper: #3a3028; --brown: #e7c9a0; --brown-d: #f5e2c6; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #9fd8ff; }
body { font-family: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', 'Yu Gothic', 'Meiryo', sans-serif; color: var(--brown-d); -webkit-tap-highlight-color: transparent; user-select: none; touch-action: none; }
#gl { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
.hidden { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }

/* HUD */
#hud { position: fixed; inset: 0; pointer-events: none; }
#hud-top { position: absolute; top: calc(12px + env(safe-area-inset-top)); left: 12px; right: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { background: rgba(255, 253, 246, .92); border: 2px solid var(--brown); border-radius: 999px; padding: 6px 14px; box-shadow: var(--shadow); font-weight: 700; font-size: 14px; white-space: nowrap; }
#hud-goal-wrap { flex: 1 1 260px; max-width: 460px; background: rgba(255, 253, 246, .92); border: 2px solid var(--brown); border-radius: 14px; padding: 6px 12px; box-shadow: var(--shadow); }
#hud-goal { font-size: 13px; font-weight: 700; }
#hud-track { height: 8px; background: #efe2c8; border-radius: 6px; margin-top: 4px; overflow: hidden; }
#hud-bar { height: 100%; width: 0; background: linear-gradient(90deg, #ffd166, #ff9f43); transition: width .4s; }
#hud-bottom { position: absolute; right: 12px; top: 84px; display: flex; flex-direction: column; gap: 8px; pointer-events: auto; align-items: flex-end; }
.pill { background: var(--paper); border: 2px solid var(--brown); border-radius: 14px; padding: 10px 14px; font-weight: 700; box-shadow: var(--shadow); }
.pill:active { transform: translateY(2px); }

#act { position: absolute; right: 22px; bottom: calc(40px + env(safe-area-inset-bottom)); width: 104px; height: 104px; border-radius: 50%; border: 4px solid #fff; background: radial-gradient(circle at 35% 30%, #9be38f, var(--leaf)); color: #fff; font-weight: 700; font-size: 14px; letter-spacing: 0; text-shadow: 0 1px 2px rgba(0,0,0,.35); box-shadow: var(--shadow); pointer-events: auto; display: flex; align-items: center; justify-content: center; text-align: center; padding: 6px; line-height: 1.2; }
#act:active { transform: scale(.96); }
#act-label { display: block; }
#btn-rot, #btn-cancel { position: absolute; right: 130px; bottom: calc(40px + env(safe-area-inset-bottom)); pointer-events: auto; }
#btn-cancel { right: 22px; bottom: calc(150px + env(safe-area-inset-bottom)); }
#joy { position: absolute; left: 18px; bottom: calc(96px + env(safe-area-inset-bottom)); width: 128px; height: 128px; border-radius: 50%; background: rgba(255, 253, 246, .35); border: 3px solid rgba(107, 74, 43, .5); pointer-events: auto; }
#joy-knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: rgba(255, 253, 246, .9); border: 3px solid var(--brown); box-shadow: var(--shadow); }
#place-hint { position: absolute; bottom: 150px; left: 50%; transform: translateX(-50%); background: rgba(255, 253, 246, .95); border: 2px solid var(--brown); border-radius: 12px; padding: 8px 14px; font-weight: 700; font-size: 14px; box-shadow: var(--shadow); white-space: nowrap; }
#bite { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); font-size: 96px; font-weight: 700; color: #ff5a5a; text-shadow: 0 4px 0 #fff, 0 0 18px rgba(255,90,90,.6); animation: pop .3s ease-out infinite alternate; }
@keyframes pop { from { transform: translate(-50%, -50%) scale(1); } to { transform: translate(-50%, -50%) scale(1.12); } }

#toasts { position: absolute; top: 96px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; width: min(92vw, 520px); }
.toast { background: rgba(60, 40, 20, .85); color: #fff; padding: 9px 16px; border-radius: 12px; font-weight: 700; font-size: 14px; box-shadow: var(--shadow); animation: slide .25s ease-out; transition: opacity .5s; }
.toast.out { opacity: 0; }
@keyframes slide { from { transform: translateY(-8px); opacity: 0; } to { transform: none; opacity: 1; } }

/* 会話 */
#dialog { position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(94vw, 760px); background: var(--paper); border: 3px solid var(--brown); border-radius: 18px; box-shadow: var(--shadow); padding: 14px 18px 16px; z-index: 20; cursor: pointer; }
#dl-name { display: inline-block; background: var(--leaf); color: #fff; border-radius: 10px; padding: 2px 12px; font-weight: 700; margin-bottom: 6px; }
#dl-text { font-size: 17px; line-height: 1.7; min-height: 3.4em; }
#dl-text::after { content: ' ▼'; font-size: 12px; opacity: .5; }

/* パネル */
#panel { position: fixed; inset: 0; background: rgba(40, 28, 16, .45); z-index: 30; display: flex; align-items: center; justify-content: center; padding: 14px; }
#panel-box { background: var(--cream); border: 3px solid var(--brown); border-radius: 20px; box-shadow: var(--shadow); width: min(980px, 100%); height: min(88vh, 860px); display: flex; flex-direction: column; overflow: hidden; }
#panel-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 2px dashed var(--brown); }
#panel-head h2 { margin: 0; font-size: 20px; }
#panel-close { background: var(--leaf); color: #fff; border: 0; border-radius: 12px; padding: 6px 14px; font-weight: 700; }
#panel-body { overflow-y: auto; padding: 12px 16px 18px; flex: 1; -webkit-overflow-scrolling: touch; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.tab { background: var(--paper); border: 2px solid var(--brown); border-radius: 12px; padding: 6px 12px; font-weight: 700; }
.tab.on { background: var(--leaf); color: #fff; border-color: var(--leaf-d); }
.note { font-size: 13px; opacity: .85; margin: 6px 0; }
.empty { padding: 30px; text-align: center; opacity: .7; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.card { background: var(--paper); border: 2px solid #e4cfa8; border-radius: 14px; padding: 6px; text-align: center; display: flex; flex-direction: column; align-items: center; min-height: 128px; }
.card.sel { border-color: var(--leaf); box-shadow: 0 0 0 3px rgba(95,174,90,.35); }
.card.dim { opacity: .5; }
.card:active { transform: scale(.98); }
.thumb { width: 84px; height: 84px; object-fit: contain; background: radial-gradient(circle, #fff 0%, #f1e6d0 100%); border-radius: 12px; }
.unknown { width: 84px; height: 84px; display: flex; align-items: center; justify-content: center; font-size: 32px; background: #efe6d6; border-radius: 12px; opacity: .6; }
.name { font-size: 12px; font-weight: 700; margin-top: 4px; line-height: 1.3; }
.cnt { font-size: 11px; opacity: .8; }
.actions { margin-top: 14px; padding: 12px; background: var(--paper); border-radius: 14px; border: 2px solid #e4cfa8; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.detail-name { font-weight: 700; font-size: 16px; width: 100%; }
.btn { background: var(--paper); border: 2px solid var(--brown); border-radius: 12px; padding: 8px 14px; font-weight: 700; }
.btn.primary { background: var(--leaf); color: #fff; border-color: var(--leaf-d); }
.btn.wide { display: block; width: 100%; margin: 10px 0; padding: 12px; }
.story { background: var(--paper); border: 2px solid #e4cfa8; border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; line-height: 1.7; }
.story.lock { opacity: .55; }
.story.now { border-color: var(--leaf); }
.story-title { font-weight: 700; font-size: 16px; margin-bottom: 4px; }
.tag { font-size: 11px; background: var(--leaf); color: #fff; border-radius: 8px; padding: 1px 8px; margin-left: 8px; vertical-align: middle; }
.friend { background: var(--paper); border: 2px solid #e4cfa8; border-radius: 14px; padding: 10px 14px; margin-bottom: 8px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px; }
.fname { font-weight: 700; }
.hearts { color: #ff6b8b; font-weight: 700; }
.cell-card { display: flex; }

/* タイトル */
#title { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: linear-gradient(180deg, rgba(159,216,255,.25), rgba(255,248,234,.55)); padding: 20px; }
#title h1 { font-size: clamp(44px, 10vw, 88px); margin: 0; color: #5a3a1c; text-shadow: 0 4px 0 #fff, 0 8px 22px rgba(90,58,28,.3); letter-spacing: .06em; }
@media (pointer: fine) { #joy { display: none; } }
#title p { margin: 8px 0 26px; font-size: 16px; font-weight: 700; color: #5a3a1c; text-shadow: 0 1px 0 #fff; }
#title .menu { display: flex; flex-direction: column; gap: 12px; width: min(300px, 80vw); }
#title button { background: var(--paper); border: 3px solid var(--brown); border-radius: 18px; padding: 14px; font-size: 18px; font-weight: 700; box-shadow: var(--shadow); }
#title button.primary { background: var(--leaf); color: #fff; border-color: var(--leaf-d); }
#title button:disabled { opacity: .45; }
#title .help { margin-top: 24px; font-size: 13px; max-width: 560px; line-height: 1.8; color: #5a3a1c; background: rgba(255,253,246,.75); padding: 10px 14px; border-radius: 14px; }

@media (max-width: 720px) {
  #hud-goal-wrap { flex-basis: 100%; }
  #panel { padding: 0; }
  #panel-box { height: 100vh; border-radius: 0; border: 0; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
  .thumb, .unknown { width: 70px; height: 70px; }
}
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="hud" class="hidden">
  <div id="hud-top">
    <div class="chip" id="hud-date"></div>
    <div class="chip" id="hud-clock"></div>
    <div class="chip" id="hud-money"></div>
    <div id="hud-goal-wrap">
      <div id="hud-goal"></div>
      <div id="hud-track"><div id="hud-bar"></div></div>
    </div>
  </div>
  <div id="hud-bottom">
    <button class="pill" id="btn-pocket" style="pointer-events:auto">ポーチ</button>
    <button class="pill" id="btn-note" style="pointer-events:auto">ノート</button>
    <button class="pill" id="btn-menu" style="pointer-events:auto">メニュー</button>
  </div>
  <div id="joy"><div id="joy-knob"></div></div>
  <button id="act" class="hidden">
    <span id="act-label"></span>
  </button>
  <button id="btn-rot" class="pill hidden">まわす (R)</button>
  <button id="btn-cancel" class="pill hidden">やめる</button>
  <div id="place-hint" class="hidden">Spaceでおく・Rでまわす・Escでやめる</div>
  <div id="bite" class="hidden">！</div>
  <div id="toasts"></div>
</div>

<div id="dialog" class="hidden">
  <div id="dl-name"></div>
  <div id="dl-text"></div>
</div>

<div id="panel" class="hidden">
  <div id="panel-box">
    <div id="panel-head">
      <h2 id="panel-title"></h2>
      <button id="panel-close">とじる</button>
    </div>
    <div id="panel-body"></div>
  </div>
</div>

<div id="title">
  <h1>ひだまり島</h1>
  <p>島の季節をめぐらせる、ちいさなスローライフ</p>
  <div class="menu">
    <button class="primary" id="btn-new">はじめから</button>
    <button id="btn-continue" disabled>つづきから</button>
  </div>
  <div class="help">
    嵐の夜、ひだまり島の浜に流れ着いたあなたの物語。<br>
    釣り・虫とり・畑・料理・家づくりをしながら、島に散らばった「ひかりのかけら」を集めましょう。<br>
    移動: WASD / 矢印キー ・ 決定: Space / Enter ・ 画面をドラッグでカメラ回転<br>
    スマホ: 左下のパッドで移動、右下の○で決定
  </div>
</div>
